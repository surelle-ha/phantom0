
server {
    listen 80;
    server_name localhost;

    default_type application/json;

    location = / {
        return 200 '{"service":"phantom0-gateway","status":"ok","message":"Phantom0 API gateway is running"}';
    }

    # Vue Frontend
    # location / {
    #     proxy_pass http://web-app:8080;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }

    # User Service
    location = /api/users { return 308 /api/users/; }
    location /api/users/ {
        proxy_pass http://user-service:8331/;
        include /etc/nginx/conf.d/proxy-headers.conf;
    }

    # Identity Service
    location = /api/identity { return 308 /api/identity/; }
    location /api/identity/ {
        proxy_pass http://identity-service:8332/;
        include /etc/nginx/conf.d/proxy-headers.conf;
    }

    # Group Service
    location = /api/groups { return 308 /api/groups/; }
    location /api/groups/ {
        proxy_pass http://group-service:8333/;
        include /etc/nginx/conf.d/proxy-headers.conf;
    }

    # Notification Service
    location = /api/notifications { return 308 /api/notifications/; }
    location /api/notifications/ {
        proxy_pass http://notification-service:8334/;
        include /etc/nginx/conf.d/proxy-headers.conf;
    }
}
